name: Deploy

# Manual only. Trigger from the Actions tab ("Run workflow") after merging to main.
# Netlify's own Git auto-publish is disabled (see netlify.toml `ignore`) so merges
# to main no longer burn Netlify build/deploy quota automatically.
on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Stamp static assets with a cache-busting version
        run: node scripts/stamp-assets.mjs
      - name: Deploy to Netlify
        run: npx netlify-cli deploy --prod --dir=. --functions=netlify/functions
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
